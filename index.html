<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>IA1 - Vanilla JavaScript</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<h1>IA1 - Vanilla JavaScript</h1>
		<div id="main"></div>
		<button id="sumar">Sumar</button>
		<button id="multi">Multiplicación</button>
		<div id="suma"></div>
		<div id="mult"></div>
		<form id="numero">
			<input type="text" id="num" />
			<button type="submit">Enviar</button>
			<p id="errorNum"></p>
		</form>
		<div>
			<select name="selectEstat" id="selectEstat">
				<option value="" disabled selected>Selecciona una opción</option>
				<option value="inicio">Inicio</option>
				<option value="turnoA">Turno A</option>
				<option value="turnoB">Turno B</option>
				<option value="final">Final</option>
			</select>
			<p id="msgEstat"></p>
			<button id="buttonColor">Cambiar color</button>
		</div>
		<div>
			<p id="msgTurno">Es turno del jugador <span>A</span></p>
			<p id="msgCasilla"></p>
			<button id="lanzarDado">Lanzar Dado</button>
			<p id="msgDado"></p>
		</div>
		<div>
			<p id="msgJugA">Jugador A: <span></span></p>
			<form action="" id="formNom">
				<input type="text" id="inputFormNom" />
				<button type="submit">Enviar nombre</button>
			</form>
		</div>
		<div>
			<p id="infoJugA">
				El jugador A está en la casilla <span id="casillaNum"> </span> (
				<span id="casillaText"> </span> )
			</p>
			<p id="infoJugB">
				El jugador B está en la casilla <span id="casillaNum"> </span> (
				<span id="casillaText"> </span> )
			</p>
		</div>

		<div id="divPregunta">
			<h2></h2>
			<div id="divPreguntas"></div>
			<p id="tipoRespuesta"></p>
		</div>
		<div id="divTableroJugadores">
			<div id="tablero"></div>
			<div id="divFichJugA" class="fichas"><span>A</span></div>
			<div id="divFichJugB" class="fichas"><span>B</span></div>
		</div>
		<div id="infoJugadorA"></div>
		<script src="index.js"></script>
	</body>
</html>
