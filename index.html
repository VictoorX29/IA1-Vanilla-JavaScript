<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>IA1 - Vanilla JavaScript</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<h1>IA1 - Vanilla JavaScript</h1>
		<div id="main"></div>
		<button id="sumar">Sumar</button>
		<button id="multi">Multiplicación</button>
		<div id="suma"></div>
		<div id="mult"></div>
		<form id="numero">
			<input type="text" id="num" />
			<button type="submit">Enviar</button>
			<p id="errorNum"></p>
		</form>
		<div>
			<select name="selectEstat" id="selectEstat">
				<option value="" disabled selected>Selecciona una opción</option>
				<option value="inicio">Inicio</option>
				<option value="turnoA">Turno A</option>
				<option value="turnoB">Turno B</option>
				<option value="final">Final</option>
			</select>
			<p id="msgEstat"></p>
			<button id="buttonColor">Cambiar color</button>
		</div>

		<script src="index.js"></script>
	</body>
</html>
